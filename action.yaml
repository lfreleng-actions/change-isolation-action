---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "🔒 Change Isolation"
description: >
  Verify a change isolates modifications to a set of gitignore-style paths,
  failing when in-scope files are combined with out-of-scope files.

inputs:
  paths:
    description: >
      Newline-separated gitignore-style patterns describing the in-scope
      paths that must be isolated. A leading '/' anchors to the repository
      root (e.g. '/INFO.yaml'); a bare name matches at any depth; '**'
      matches across directories (e.g. '.github/**'). '!' negation is
      supported.
    required: true
  base-ref:
    description: >
      Git reference to diff HEAD against. Defaults to 'HEAD~1' (the parent of
      a single-commit change). Supply a branch such as 'origin/main' for
      pull-request style comparisons. The reference must exist in local
      history; increase the checkout fetch-depth if it does not. Unused when
      'changed-files' is non-empty.
    required: false
    default: "HEAD~1"
  changed-files:
    description: >
      Newline-separated list of repository-relative paths to evaluate instead
      of asking git. When non-empty, the action runs no git command at all,
      needs no checkout and ignores 'base-ref'. Surrounding whitespace and
      blank lines are dropped; entries are otherwise taken as-is, and an
      entry containing a control character fails the step. When empty (the
      default) the list comes from git, so an empty change cannot be passed
      here.
    required: false
    default: ""
  fail-on-violation:
    description: >
      When 'true' (default), exit with a non-zero status if isolation is
      violated. When 'false', report the violation as a warning without
      failing the step.
    required: false
    default: "true"

outputs:
  isolated:
    description: "'true' if the change is isolated, otherwise 'false'."
    value: ${{ steps.check.outputs.isolated }}
  triggered:
    description: >
      'true' if at least one changed file matched the in-scope patterns,
      otherwise 'false' (the no-op case).
    value: ${{ steps.check.outputs.triggered }}
  scanned:
    description: >
      Deprecated alias for 'triggered'; use 'triggered' instead.
    value: ${{ steps.check.outputs.scanned }}
  violating-files:
    description: >
      Newline-separated list of out-of-scope files that break isolation.
    value: ${{ steps.check.outputs.violating-files }}
  changed-files:
    description: >
      Newline-separated list of the changed files the action evaluated, from
      the 'changed-files' input or from git.
    value: ${{ steps.check.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    # Resolve the interpreter here rather than take python3 from the
    # caller's PATH. An explicit python-version keeps setup-python from
    # reading a version file in the workspace, and update-environment
    # false leaves the caller's PATH and Python variables untouched.
    - name: "Set up Python"
      id: setup-python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.x"
        update-environment: false

    - name: "Run change isolation check"
      id: check
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_CHANGED_FILES: ${{ inputs.changed-files }}
        INPUT_FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        ACTION_PATH: ${{ github.action_path }}
        PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        # Run the interpreter setup-python resolved, with the standard
        # library alone. Keep the minimum in step with requires-python in
        # change_isolation.py.
        check='import sys; print("%d.%d.%d" % sys.version_info[:3]);'
        check+=' sys.exit(sys.version_info < (3, 11))'
        if ! version="$("$PYTHON" -I -c "$check" 2> /dev/null)"; then
          echo "::error::Python is ${version:-unusable}; this action" \
            "needs Python 3.11 or newer"
          exit 1
        fi
        # Evaluate isolation against the consumer's checked-out repository
        # (the workspace), running the script from this action's checkout.
        cd "$GITHUB_WORKSPACE"
        "$PYTHON" -I "${ACTION_PATH}/change_isolation.py"
