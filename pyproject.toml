[project]
name = "change-isolation-action"
version = "0.0.0"
description = "Verify a change isolates modifications to a set of paths"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pathspec>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[tool.basedpyright]
# The minimum Python, from requires-python (and the PEP 723 header).
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Matches the targets the pre-commit hook passes, so a bare basedpyright
# run or an editor's language server analyses the same set.
include = ["change_isolation.py", "tests"]
